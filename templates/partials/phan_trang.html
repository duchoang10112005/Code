{% if trang.has_other_pages %}
<nav class="mt-3" aria-label="Phân trang"><ul class="pagination pagination-sm">
  {% if trang.has_previous %}<li class="page-item"><a class="page-link" aria-label="Trang trước" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ trang.previous_page_number }}"><i class="bi bi-chevron-left" aria-hidden="true"></i></a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link" aria-current="page">Trang {{ trang.number }}/{{ trang.paginator.num_pages }}</span></li>
  {% if trang.has_next %}<li class="page-item"><a class="page-link" aria-label="Trang sau" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ trang.next_page_number }}"><i class="bi bi-chevron-right" aria-hidden="true"></i></a></li>{% endif %}
</ul></nav>
{% endif %}
