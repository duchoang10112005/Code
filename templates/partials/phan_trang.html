{% if trang.has_other_pages %}
<nav class="mt-3"><ul class="pagination pagination-sm">
  {% if trang.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ trang.previous_page_number }}">‹</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Trang {{ trang.number }}/{{ trang.paginator.num_pages }}</span></li>
  {% if trang.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ trang.next_page_number }}">›</a></li>{% endif %}
</ul></nav>
{% endif %}
