{# Lọc ô "Cấp độ học" theo loại môn của môn đã chọn. Cần biến context: ban_do_cap_do = {mon: {id: loai}, cap_do: {id: loai}} #}
{{ ban_do_cap_do|json_script:"ban-do-cap-do" }}
<script>
  (function () {
    const bd = JSON.parse(document.getElementById("ban-do-cap-do").textContent);
    const mon = document.getElementById("id_mon_hoc"), cap = document.getElementById("id_cap_do");
    if (!mon || !cap) return;
    function loc() {
      const loai = bd.mon[mon.value];
      [...cap.options].forEach((o) => { if (o.value) o.hidden = bd.cap_do[o.value] !== loai; });
      if (cap.value && bd.cap_do[cap.value] !== loai) cap.value = "";
      cap.disabled = !mon.value;
    }
    mon.addEventListener("change", loc); loc();
  })();
</script>
