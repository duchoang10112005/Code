{% extends "base.html" %}
{% block title %}{{ tieu_de }} · {{ TEN_HE_THONG }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb small mb-2">
  <li class="breadcrumb-item"><a href="{% url 'tai_khoan_danh_sach' %}">Tài khoản</a></li>
  <li class="breadcrumb-item active" aria-current="page">{{ tieu_de }}</li>
</ol></nav>
<div class="dau-trang"><h1>{{ tieu_de }}</h1></div>
<div class="card" style="max-width:560px"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="d-flex gap-2">
      <button class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i>Lưu</button>
      <a href="{% url 'tai_khoan_danh_sach' %}" class="btn btn-outline-secondary"><i class="bi bi-x-lg" aria-hidden="true"></i>Hủy</a>
    </div>
  </form>
</div></div>
{% endblock %}
