{% extends "base.html" %}
{% block title %}Đăng nhập · {{ TEN_HE_THONG }}{% endblock %}
{% block public_content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <div class="d-inline-grid rounded-3 p-3 mb-2" style="background:var(--gs-primary-soft);color:var(--gs-primary)">
        <i class="bi bi-mortarboard-fill" style="font-size:2.25rem" aria-hidden="true"></i></div>
      <h1 class="mb-1">{{ TEN_HE_THONG }}</h1>
      <p class="text-muted small mb-0">Dành cho Admin, Nhân viên tuyển sinh và Gia sư</p>
    </div>
    <div class="card"><div class="card-body p-4">
      <form method="post" novalidate>{% csrf_token %}
        {% include "partials/form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Đăng nhập</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
